name: Sync Hugging Face Space

on:
  workflow_dispatch:
    inputs:
      space_id:
        description: Hugging Face Space ID
        required: true
        default: BlueSkyXN/Data-Agent-Panel-HFS

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SPACE_ID: ${{ inputs.space_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hugging Face CLI
        run: python -m pip install -U "huggingface_hub[cli]"
      - name: Verify required secret
        run: test -n "$HF_TOKEN"
      - name: Static contract checks
        run: python scripts/static_check.py
      - name: Upload tracked Space root
        run: |
          hf upload "$SPACE_ID" . . \
            --repo-type space \
            --delete "*" \
            --commit-message "Sync Data Agent Panel from GitHub ${GITHUB_SHA}" \
            --exclude ".git/**" \
            --exclude ".github/**" \
            --exclude ".env*" \
            --exclude "local/**" \
            --exclude "data/**" \
            --exclude "logs/**" \
            --exclude "__pycache__/**" \
            --exclude "*.pyc" \
            --exclude "*.secret" \
            --exclude "*.key" \
            --exclude "*.pem" \
            --exclude "*.p12" \
            --exclude "*.pfx"
      - name: Factory rebuild Space
        run: hf spaces restart "$SPACE_ID" --factory-reboot
