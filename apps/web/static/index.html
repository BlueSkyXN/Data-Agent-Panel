<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#171717" />
  <title>独立数据智能体平台</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/styles.css?v=0.7.0-calm-workspace" />
</head>
<body>
  <div id="login" class="login-screen">
    <div class="login-shell">
      <div class="login-copy">
        <div class="eyebrow">DATA AGENT PLATFORM</div>
        <h1>独立数据智能体平台</h1>
        <p>从业务问题开始，在同一工作空间中组织分析、证据、结论、复核与下一步。</p>
        <div class="login-badges">
          <span>可追溯分析</span><span>只读 SQL</span><span>受控工程任务</span><span>RBAC</span>
        </div>
      </div>
      <form class="login-card" onsubmit="event.preventDefault(); login();">
        <h2>登录</h2>
        <label for="username">用户名</label><input id="username" value="admin" autocomplete="username" />
        <label for="password">密码</label><input id="password" value="admin123" type="password" autocomplete="current-password" />
        <button type="submit">进入平台</button>
        <div class="hint">默认：admin/admin123 或 user/user123。生产环境请禁用演示账号。</div>
      </form>
    </div>
  </div>

  <div id="app" class="app hidden">
    <div class="sidebar-backdrop" onclick="toggleSidebar(false)" aria-hidden="true"></div>
    <aside class="sidebar" aria-label="主导航">
      <div class="logo"><div>DA</div><span>DATA AGENT</span></div>
      <nav id="nav">
        <span class="nav-section">主要工作</span>
        <button data-page="workspace" onclick="showPage('workspace')">工作空间</button>
        <button data-page="chat" onclick="showPage('chat')">智能问数</button>
        <button data-page="analysis" onclick="showPage('analysis')">深度研究</button>
        <span class="nav-section">治理与运营</span>
        <button data-page="dataops" onclick="showPage('dataops')">数据与语义</button>
        <button data-page="audit" onclick="showPage('audit')">证据与审计</button>
      </nav>
      <div class="user-box"><span id="currentUser"></span><button class="ghost-dark" onclick="logout()">退出</button></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="mobileMenu" class="icon-button mobile-menu" type="button" aria-label="打开导航" aria-expanded="false" onclick="toggleSidebar()">
          <span></span><span></span><span></span>
        </button>
        <div class="top-title">
          <div class="eyebrow">Evidence-first data work</div>
          <strong id="pageTitle">工作空间</strong>
          <div class="top-status" aria-label="平台安全状态">
            <span>RBAC</span><span>SQL Guard</span><span>Trace</span>
          </div>
        </div>
        <div class="top-actions">
          <input id="globalSearch" aria-label="全局搜索" aria-controls="commandMenu" aria-expanded="false" placeholder="搜索工作空间、页面、数据或会话" onfocus="renderCommandMenu()" oninput="renderCommandMenu()" onkeydown="handleGlobalSearchKey(event)" />
          <button class="secondary" onclick="globalJump()">搜索</button>
          <button onclick="createWorkspaceFromShell()">新建工作空间</button>
          <div id="commandMenu" class="command-menu hidden" role="listbox" aria-label="全局指挥入口"></div>
        </div>
      </header>
      <section id="page-workspace" class="page"></section>
      <section id="page-dashboard" class="page hidden"></section>
      <section id="page-agents" class="page hidden"></section>
      <section id="page-chat" class="page hidden"></section>
      <section id="page-analysis" class="page hidden"></section>
      <section id="page-panels" class="page hidden"></section>
      <section id="page-dataops" class="page hidden"></section>
      <section id="page-semantic" class="page hidden"></section>
      <section id="page-codex" class="page hidden"></section>
      <section id="page-reports" class="page hidden"></section>
      <section id="page-knowledge" class="page hidden"></section>
      <section id="page-evals" class="page hidden"></section>
      <section id="page-audit" class="page hidden"></section>
      <section id="page-ops" class="page hidden"></section>
      <section id="page-admin" class="page hidden"></section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js?v=0.7.0-calm-workspace"></script>
</body>
</html>
